name: "Proposer une amélioration"
description: "Une idée pour que Prévo serve mieux sur le terrain."
title: "[Amélioration] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **N'envoyez aucune donnée réelle de votre entreprise.**

        **Ne collez jamais** un mot de passe, un jeton, un cookie, une clé d'IA, ni le contenu du dossier `donnees/acces/` ou de `prevo.config.json`.
  - type: textarea
    id: besoin
    attributes:
      label: "Votre besoin sur le terrain"
      description: "Ce que vous cherchez à faire, dans votre atelier."
    validations:
      required: true
  - type: textarea
    id: aujourdhui
    attributes:
      label: "Comment faites-vous aujourd'hui ?"
      description: "Avec Prévo, un tableur, un cahier… et ce qui coince."
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: "Votre installation (facultatif)"
      options:
        - "Solo (une personne, un PC)"
        - "Atelier (une petite équipe sur le Wi-Fi)"
        - "Intranet (installé par l'informaticien)"
        - "Mode dossier ou démo"
    validations:
      required: false
  - type: textarea
    id: aide
    attributes:
      label: "Ce qui vous aiderait"
    validations:
      required: true
  - type: textarea
    id: contexte
    attributes:
      label: "Version de Prévo, langue, navigateur (rempli par Prévo)"
      description: "Rempli par le lien « Suggérer une amélioration » de Prévo ; vous pouvez le modifier ou l'effacer."
    validations:
      required: false
