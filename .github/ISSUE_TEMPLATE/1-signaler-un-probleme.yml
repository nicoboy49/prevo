name: "Report a problem / Signaler un problème"
description: "Something does not work as expected in Prévo. / Quelque chose ne fonctionne pas comme prévu dans Prévo."
title: "[Problème] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is PUBLIC. Do not send any real company data, and do not attach any company file: files are sent privately.**

        **Never paste** a password, a temporary password, a token, a cookie, an AI key, or the content of the `donnees/acces/` folder (accounts, sessions, devices, workshop certificate) or of `prevo.config.json`.

        Connection problem? Describe what the screen says. The connection log (`journal-acces.csv`) contains names and addresses: never attach it here; if it is needed, it will be asked for privately.

        ---

        **Ce ticket est PUBLIC. N'envoyez aucune donnée réelle de votre entreprise et ne joignez aucun fichier de l'entreprise : les fichiers s'envoient en privé.**

        **Ne collez jamais** un mot de passe, un mot de passe provisoire, un jeton, un cookie, une clé d'IA, ni le contenu du dossier `donnees/acces/` (comptes, sessions, appareils, certificat de l'atelier) ou de `prevo.config.json`.

        Problème de connexion ? Décrivez ce que dit l'écran. Le journal des connexions (`journal-acces.csv`) contient des noms et des adresses : ne le joignez jamais ici ; s'il faut le voir, il vous sera demandé en privé.
  - type: textarea
    id: action
    attributes:
      label: "What did you do? / Qu'avez-vous fait ?"
      description: "The steps, in order: screen, buttons clicked, values entered (examples, not your real data). / Les étapes, dans l'ordre : écran, boutons cliqués, valeurs saisies (des exemples, pas vos vraies données)."
      placeholder: "1. Logged in as technician, Work orders screen / Connecté comme technicien, écran Ordres de travail\n2. Click on a work order, then \"Close\" / Clic sur un OT, puis « Clôturer »\n3. …"
    validations:
      required: true
  - type: textarea
    id: attendu
    attributes:
      label: "What did you expect? / Qu'attendiez-vous ?"
    validations:
      required: true
  - type: textarea
    id: constate
    attributes:
      label: "What happened? / Que s'est-il passé ?"
      description: "The message shown, word for word if there is one. / Le message affiché, mot pour mot s'il y en a un."
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: "Mode used / Mode utilisé"
      options:
        - "Server (Prévo installed: Lancer_GMAO.bat or lancer.sh) / Serveur (Prévo installé : Lancer_GMAO.bat ou lancer.sh)"
        - "Folder (a single PC, Chrome or Edge) / Dossier (un seul poste, Chrome ou Edge)"
        - "Demo (demo data, on this PC or online) / Démo (données de démo, sur ce PC ou en ligne)"
    validations:
      required: true
  - type: dropdown
    id: portee
    attributes:
      label: "Reach / Portée"
      description: "Where Prévo is opened from (set by the installation assistant; visible in Settings › Access and installation). / D'où Prévo est ouvert (réglé par l'assistant d'installation ; visible dans Paramètres › Accès et installation)."
      options:
        - "This PC only / Ce PC seulement"
        - "The workshop Wi-Fi / Le Wi-Fi de l'atelier"
        - "Outside the workshop (Tailscale or VPN) / Hors de l'atelier (Tailscale ou VPN)"
        - "Company network, behind a proxy (Intranet) / Réseau de l'entreprise, derrière un mandataire (Intranet)"
        - "I do not know, or not applicable (folder mode, demo) / Je ne sais pas, ou sans objet (mode dossier, démo)"
    validations:
      required: true
  - type: input
    id: appareil
    attributes:
      label: "Device and browser / Appareil et navigateur"
      placeholder: "Example / Exemple : Windows 11 PC with Edge, Android phone with Chrome, iPhone with Safari"
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: "Role / Rôle"
      options:
        - "Requester, phone enrolled by invitation (no password) / Demandeur, téléphone enrôlé par invitation (sans mot de passe)"
        - "Requester, with an account / Demandeur, avec un compte"
        - "Technician / Technicien"
        - "Manager / Responsable"
        - "No account (profile chosen on screen) / Sans compte (profil choisi à l'écran)"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Prévo version (optional) / Version de Prévo (facultatif)"
      description: "\"About\" screen. / Écran « À propos »."
    validations:
      required: false
  - type: textarea
    id: capture
    attributes:
      label: "Screenshot (optional) / Capture d'écran (facultatif)"
      description: "Drag the image into this field. First hide any real data, any password and any invitation QR code. / Glissez l'image dans ce champ. Masquez d'abord toute donnée réelle, tout mot de passe et tout QR d'invitation."
    validations:
      required: false
